name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (Facebook / YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target Language Code (e.g., hi, es, fr)'
        required: true
        default: 'hi'

jobs:
  dub:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Cache Pip Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg (Direct High-Speed Binary)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffmpeg -version

      - name: 📦 Update yt-dlp & Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Run Dubbing Script
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: ⚡ Generate Direct High-Speed Download Links
        run: |
          echo "==========================================="
          echo "🎥 FAST DIRECT VIDEO DOWNLOAD LINK (Litterbox CDN):"
          curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@final_output.mp4" https://litterbox.catbox.moe/resources/internals/api.php
          echo ""
          echo "📝 FAST DIRECT SUBTITLES LINK:"
          curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@subtitles.srt" https://litterbox.catbox.moe/resources/internals/api.php
          echo ""
          echo "==========================================="

      - name: 🏷️ Publish to GitHub Release (Direct CDN Link)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: run-${{ github.run_number }}
          name: Dubbed Output Run #${{ github.run_number }}
          files: |
            final_output.mp4
            subtitles.srt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
