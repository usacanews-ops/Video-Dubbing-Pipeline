name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (Facebook / YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target Language Code (e.g., hi, es, fr)'
        required: true
        default: 'hi'

jobs:
  dub:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Cache Pip Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Setup FFmpeg (Fast Cache)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          architecture: linux64

      - name: 📦 Update yt-dlp & Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Run Dubbing Script
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: ⚡ Upload to High-Speed Server (Bypass GitHub Slow DL)
        run: |
          echo "==========================================="
          echo "🎥 DOWNLOADING VIDEO FILE (FAST SPEED):"
          curl -T final_output.mp4 https://bashupload.com/final_output.mp4
          echo ""
          echo "📝 DOWNLOADING SUBTITLE FILE:"
          curl -T subtitles.srt https://bashupload.com/subtitles.srt
          echo "==========================================="

      - name: 📤 Upload Dubbed Video to GitHub (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-package
          path: |
            final_output.mp4
            subtitles.srt
