name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (Facebook / YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target Language Code (e.g., hi, en, es, fr, de)'
        required: true
        default: 'hi'
      video_speed:
        description: 'Playback Speed Factor'
        required: false
        default: '1.0'

jobs:
  dub:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Cache Pip Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffmpeg -version

      - name: 📦 Update yt-dlp & Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Run Dubbing Script
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: 🏷️ Publish Release (Direct CDN Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}-${{ github.run_id }}
          name: Dubbed Video #${{ github.run_number }}
          files: |
            final_output.mp4
            subtitles.srt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
