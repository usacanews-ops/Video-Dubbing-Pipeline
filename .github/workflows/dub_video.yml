name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL of the source video (Facebook/YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target language code (e.g., hi, es, en)'
        required: true
        default: 'hi'
        type: string
      video_speed:
        description: 'Playback speed multiplier'
        required: false
        default: '1.0'
        type: string
      device_id:
        description: 'Unique client device identifier'
        required: false
        default: 'default'
        type: string

run-name: "Dub [${{ inputs.device_id }}] - ${{ inputs.target_language }}"

jobs:
  dub_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          # Remove broken third-party Google Chrome repository list from runner image
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get clean
          sudo apt-get update -o Acquire::CompressionTypes::Order::=gz
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp faster-whisper deep-translator edge-tts pydub

      - name: Run Dubbing Pipeline
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}" "${{ inputs.device_id }}"

      - name: Tag and Release Output
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ inputs.device_id }}-${{ github.run_id }}"
          name: "Dubbed Run ${{ github.run_id }} [${{ inputs.device_id }}]"
          files: |
            final_output.mp4
            subtitles.srt
            source_meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Latest 25)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 25
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
