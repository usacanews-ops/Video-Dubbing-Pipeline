name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (Facebook / YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target Language Code (e.g., hi, es, fr)'
        required: true
        default: 'hi'

jobs:
  dub:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Cache Pip Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg (Direct High-Speed Binary)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffmpeg -version

      - name: 📦 Update yt-dlp & Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Run Dubbing Script
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: ⚡ Upload to High-Speed Server (Bypass GitHub Slow DL)
        run: |
          echo "==========================================="
          echo "🎥 FAST DOWNLOAD LINK (TMPFILES):"
          curl -s -F "file=@final_output.mp4" https://tmpfiles.org/api/v1/upload | jq -r '.data.url' | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//'
          echo ""
          echo "🎥 BACKUP FAST LINK (FILE.IO):"
          curl -s -F "file=@final_output.mp4" https://file.io | jq -r '.link'
          echo ""
          echo "📝 SUBTITLES FAST LINK:"
          curl -s -F "file=@subtitles.srt" https://file.io | jq -r '.link'
          echo "==========================================="

      - name: 📤 Upload Dubbed Video to GitHub (Artifact Backup)
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-package
          path: |
            final_output.mp4
            subtitles.srt
