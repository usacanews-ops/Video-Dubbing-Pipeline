name: Cloud Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Target Video Link'
        required: true
        type: string
      target_language:
        description: 'Language'
        required: true
        default: 'hi'
      video_speed:
        description: 'Speed Rate'
        required: false
        default: '1.0'

jobs:
  dub:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Initialize Workspace
        uses: actions/checkout@v4

      - name: 🐍 Prepare Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install Media Utilities
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe

      - name: 📦 Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Execute AI Engine
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: 🏷️ Deploy Cloud Media Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Asset #${{ github.run_number }}
          files: |
            final_output.mp4
            subtitles.srt
            source_meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
