name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (Facebook / YouTube)'
        required: true
        type: string
      target_language:
        description: 'Target Language Code (e.g., hi, es, fr)'
        required: true
        default: 'hi'

jobs:
  dub:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Cache Pip Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 Update yt-dlp & Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: 🚀 Run Dubbing Script
        run: |
          python dubber.py "${{ inputs.video_url }}" "${{ inputs.target_language }}"

      - name: 📤 Upload Dubbed Video and Subtitles
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-package
          path: |
            final_output.mp4
            subtitles.srt
